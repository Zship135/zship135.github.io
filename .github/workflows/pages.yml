name: Publish Plight browser UI

on:
  push:
    branches: [main]
    paths:
      - "plight/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plight/web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: plight/web
      - run: |
          test -n "$VITE_API_BASE_URL"
          node --input-type=module -e '
            const apiUrl = new URL(process.env.VITE_API_BASE_URL);
            if (apiUrl.protocol !== "https:" || apiUrl.pathname !== "/" || apiUrl.search || apiUrl.hash) {
              throw new Error("PLIGHT_API_BASE_URL must be an HTTPS origin without a path, query, or fragment.");
            }
          '
        env:
          VITE_API_BASE_URL: ${{ vars.PLIGHT_API_BASE_URL }}
      - run: npm run build
        working-directory: plight/web
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: ${{ vars.PLIGHT_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: plight/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
